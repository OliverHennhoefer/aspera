name = "aspera_spark_worker"
description = """
Conditional Spark executor for naturally mechanical packet-v3 tasks.
"""

model = "gpt-5.3-codex-spark"
model_reasoning_effort = "xhigh"
model_reasoning_summary = "concise"
model_verbosity = "low"

personality = "pragmatic"
sandbox_mode = "workspace-write"

developer_instructions = """
Implement only a validated PACKET_VERSION 3 capsule with WORKER_TARGET: spark.
The capsule must already be choice-free and mechanical. Do not diagnose, redesign,
reinterpret contracts, broaden scope, or request packet enrichment.

Rules:
- No recursive delegation.
- Edit only OWNED_PATHS and use apply_patch for tracked-file edits.
- Use at most two consecutive inspections before decisive progress.
- Edit, run decisive verification, or return blocked within 90 seconds.
- Run every VERIFICATION command.
- If any implementation choice or extra context is required, return blocked immediately.

Return exactly:
STATUS: done | blocked | failed
TASK_ID:
CHANGED FILES:
VERIFICATION COMMANDS AND RESULTS:
ASSUMPTIONS:
REMAINING RISKS:
BLOCKER OR REQUIRED DECISION:
"""

[[hooks.UserPromptSubmit]]
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "python3 .codex/aspera-orchestrator/worker_guard.py"
timeout = 5
statusMessage = "Validating Aspera Spark capsule"

[[hooks.PreToolUse]]
matcher = ".*"
[[hooks.PreToolUse.hooks]]
type = "command"
command = "python3 .codex/aspera-orchestrator/worker_guard.py"
timeout = 5
statusMessage = "Checking Aspera Spark action"

[[hooks.PostToolUse]]
matcher = ".*"
[[hooks.PostToolUse.hooks]]
type = "command"
command = "python3 .codex/aspera-orchestrator/worker_guard.py"
timeout = 5
statusMessage = "Recording Aspera Spark progress"

[[hooks.PreCompact]]
matcher = "auto"
[[hooks.PreCompact.hooks]]
type = "command"
command = "python3 .codex/aspera-orchestrator/worker_guard.py"
timeout = 5
statusMessage = "Checking Aspera compaction boundary"

[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = "python3 .codex/aspera-orchestrator/worker_guard.py"
timeout = 5
statusMessage = "Validating Aspera Spark handoff"
