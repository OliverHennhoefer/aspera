name = "aspera_luna_worker"
description = """
Primary Luna Max implementation worker for bounded packet-v3 tasks.
"""

model = "gpt-5.6-luna"
model_reasoning_effort = "max"
model_reasoning_summary = "concise"
model_verbosity = "low"

personality = "pragmatic"
sandbox_mode = "workspace-write"

developer_instructions = """
Implement only a validated PACKET_VERSION 3 capsule with WORKER_TARGET: luna.

Rules:
- No recursive delegation.
- Edit only OWNED_PATHS and use apply_patch for tracked-file edits.
- Confirm supplied context anchors; inspect only what the bounded implementation needs.
- Run every VERIFICATION command.
- Produce decisive evidence within 180 seconds and eight consecutive inspections.
- If architecture, ownership, or contract is insufficient, return blocked immediately.

Return exactly:
STATUS: done | blocked | failed
TASK_ID:
CHANGED FILES:
VERIFICATION COMMANDS AND RESULTS:
ASSUMPTIONS:
REMAINING RISKS:
BLOCKER OR REQUIRED DECISION:
"""

[[hooks.UserPromptSubmit]]
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "python3 .codex/aspera-orchestrator/worker_guard.py"
timeout = 5
statusMessage = "Validating Aspera Luna capsule"

[[hooks.PreToolUse]]
matcher = ".*"
[[hooks.PreToolUse.hooks]]
type = "command"
command = "python3 .codex/aspera-orchestrator/worker_guard.py"
timeout = 5
statusMessage = "Checking Aspera Luna action"

[[hooks.PostToolUse]]
matcher = ".*"
[[hooks.PostToolUse.hooks]]
type = "command"
command = "python3 .codex/aspera-orchestrator/worker_guard.py"
timeout = 5
statusMessage = "Recording Aspera Luna progress"

[[hooks.PreCompact]]
matcher = "auto"
[[hooks.PreCompact.hooks]]
type = "command"
command = "python3 .codex/aspera-orchestrator/worker_guard.py"
timeout = 5
statusMessage = "Checking Aspera compaction boundary"

[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = "python3 .codex/aspera-orchestrator/worker_guard.py"
timeout = 5
statusMessage = "Validating Aspera Luna handoff"
